services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shopify_orders
      POSTGRES_USER: shopify
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopify -d shopify_orders"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports: ["5000:5000"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
